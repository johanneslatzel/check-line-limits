<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img" aria-labelledby="title desc">
  <title id="title">check-line-limits architecture</title>
  <desc id="desc">The CLI loads line-limits.json into a LineLimitsConfig. walkDir merges DEFAULT_EXTENSIONS with configured extensions, resolves each file language, and checkLineLimits passes the file to sloc.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6482b9"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a1a1a">
    <g>
      <rect x="80" y="40" width="200" height="44" rx="8" ry="8" fill="#f5f5f5" stroke="#666666"/>
      <text x="180" y="67" text-anchor="middle">cli.ts</text>
    </g>
    <g>
      <rect x="80" y="130" width="200" height="44" fill="#dae8fc" stroke="#6c8ebf"/>
      <text x="180" y="157" text-anchor="middle">loadConfig</text>
    </g>
    <g>
      <rect x="80" y="250" width="200" height="44" fill="#d5e8d4" stroke="#82b366"/>
      <text x="180" y="277" text-anchor="middle">walkDir</text>
    </g>
    <g>
      <rect x="80" y="360" width="200" height="44" fill="#d5e8d4" stroke="#82b366"/>
      <text x="180" y="387" text-anchor="middle">checkLineLimits</text>
    </g>
    <g>
      <rect x="80" y="460" width="200" height="44" rx="8" ry="8" fill="#f5f5f5" stroke="#666666"/>
      <text x="180" y="487" text-anchor="middle">sloc</text>
    </g>
    <g>
      <rect x="400" y="130" width="200" height="44" fill="#dae8fc" stroke="#6c8ebf" stroke-dasharray="4 3"/>
      <text x="500" y="157" text-anchor="middle">line-limits.json</text>
    </g>
    <g>
      <rect x="400" y="230" width="200" height="44" fill="#dae8fc" stroke="#6c8ebf"/>
      <text x="500" y="257" text-anchor="middle">DEFAULT_EXTENSIONS</text>
    </g>
    <g>
      <rect x="400" y="300" width="200" height="44" fill="#dae8fc" stroke="#6c8ebf" stroke-dasharray="4 3"/>
      <text x="500" y="327" text-anchor="middle">extensions</text>
    </g>

    <g fill="none" stroke="#6482b9" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M180 84 L180 126"/>
      <path d="M400 152 L284 152"/>
      <path d="M180 174 L180 246"/>
      <path d="M400 252 L340 252 L340 262 L284 262"/>
      <path d="M400 322 L340 322 L340 282 L284 282"/>
      <path d="M180 294 L180 356"/>
      <path d="M180 404 L180 456"/>
    </g>

    <g font-size="10" fill="#555555">
      <text x="190" y="108">loadConfig()</text>
      <text x="342" y="145" text-anchor="end">JSON</text>
      <text x="190" y="214">LineLimitsConfig</text>
      <text x="346" y="246">built-ins</text>
      <text x="346" y="338">configured</text>
      <text x="190" y="330">WalkedFile.lang</text>
      <text x="190" y="436">count SLOC</text>
    </g>
  </g>
</svg>
